name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mc-agents/bot-mineflayer

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version check diffs against the commit this one replaced, which a shallow
          # clone does not have.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The published tag is built from package.json, so two releases that ship different code
      # under the same version would be told apart only by a timestamp. On a pull request the
      # base branch is the comparison; on a push it is the commit that was replaced.
      #
      # A force push leaves nothing to compare against: the commit it names is gone from the
      # repository. Only the consistency half runs there.
      - name: version is consistent and was raised
        env:
          FORCED: ${{ github.event.forced }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$FORCED$BASE" in
            true*|''|0000000000000000000000000000000000000000) node scripts/check-version.ts ;;
            *) node scripts/check-version.ts "$BASE" ;;
          esac
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN pushes to ghcr.io under this org, so no registry secret has to exist.
      packages: write
      # Lets cosign fetch a short-lived certificate from Fulcio, so no key lives in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          stamp=$(date -u +%Y%m%d%H%M%S)
          sha=$(git rev-parse --short=8 HEAD)
          case "$version" in *-*) sep=. ;; *) sep=- ;; esac
          echo "value=${version}${sep}${stamp}.g${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - run: |
          {
            echo "published \`${{ env.IMAGE }}:${{ steps.tag.outputs.value }}\`"
            echo ""
            echo "verify:"
            echo '```'
            echo "cosign verify ${{ env.IMAGE }}:${{ steps.tag.outputs.value }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
